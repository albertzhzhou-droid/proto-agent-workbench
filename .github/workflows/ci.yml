name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.profile }} (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: base, python-version: "3.10", os: windows-latest, extras: ""}
          - {profile: base, python-version: "3.12", os: windows-latest, extras: ""}
          - {profile: compute, python-version: "3.12", os: windows-latest, extras: "--extra compute --extra compute-research"}
          - {profile: figures, python-version: "3.12", os: ubuntu-latest, extras: "--extra research-figures"}
          - {profile: figures, python-version: "3.12", os: windows-latest, extras: "--extra research-figures"}
          - {profile: heavy, python-version: "3.12", os: windows-latest, extras: "--extra compute --extra compute-models --extra compute-vision --extra compute-medical --extra compute-chem --extra compute-genomics"}
          - {profile: linux-worker, python-version: "3.12", os: ubuntu-latest, extras: ""}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Canonicalize Windows temporary paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $canonicalTemp = python -c "from pathlib import Path; import tempfile; print(Path(tempfile.gettempdir()).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) {
            "$name=$canonicalTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Install pinned environment manager
        run: python -m pip install uv==0.12.3
      - name: Classify every Python test before environment setup
        run: python scripts/run-test-profile.py --profile ${{ matrix.profile }} --list --report build/ci/${{ matrix.profile }}-plan.json
      - name: Install the locked profile in a clean virtual environment
        run: uv sync --locked --python ${{ matrix.python-version }} --no-managed-python ${{ matrix.extras }}
      - name: Check installed dependencies
        run: uv pip check
      - name: Run profile with explicit result counts
        run: uv run --locked --no-sync python -B scripts/run-test-profile.py --profile ${{ matrix.profile }} --report build/ci/${{ matrix.profile }}-results.json
      - name: Preserve profile evidence even when setup or tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.profile }}-${{ matrix.python-version }}-${{ matrix.os }}
          path: build/ci/*.json
          if-no-files-found: error

  workbench:
    name: Workbench contracts, typecheck and offline baseline
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PROTO_CHEM_PYTHON: ${{ github.workspace }}/.venv/Scripts/python.exe
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
      PROTO_TYPOGRAPHY_PROFILE: public
    defaults:
      run:
        working-directory: apps/proto-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonicalize Windows temporary paths
        shell: pwsh
        run: |
          $canonicalTemp = python -c "from pathlib import Path; import tempfile; print(Path(tempfile.gettempdir()).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) {
            "$name=$canonicalTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Install pinned Python environment manager
        run: python -m pip install uv==0.12.3
      - name: Provision actual Python and Chem runtimes used by integration tests
        working-directory: .
        run: uv sync --locked --python 3.12 --no-managed-python --extra compute --extra compute-research --extra compute-vision --extra compute-chem --extra chem-workbench --extra research-figures --extra workbench
      - name: Check Python runtime dependencies
        working-directory: .
        run: uv pip check
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/proto-workbench/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Record Workbench validation environment
        run: |
          New-Item -ItemType Directory -Force ../../build/ci | Out-Null
          @{ sourceCommit = $env:GITHUB_SHA; runnerOS = $env:RUNNER_OS; node = (node --version); scope = "Validation environment only; check outcomes are recorded separately." } |
            ConvertTo-Json | Set-Content ../../build/ci/workbench-environment.json
      - name: Typecheck shared contracts, host, preload and renderer
        run: pnpm typecheck
      - name: Verify generated Python tool contracts match the canonical table
        run: node scripts/export-tool-contracts.mjs --check
      - name: Verify architecture scope ledger references and generated document
        run: node ../../scripts/generate-architecture-capabilities.mjs --check
      - name: Verify generated scientific units match the Python contract
        run: ../../.venv/Scripts/python.exe scripts/generate-scientific-units.py --check
      - name: Run mandatory execution and contract regression tests
        run: >-
          node --test --test-concurrency=4 --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=tap --test-reporter-destination=../../build/ci/workbench-regression.tap
          tests/tool-contracts.test.mjs tests/execution-kernel.test.mjs tests/production-kernel-context.test.mjs
          tests/tool-execution-journal.test.mjs tests/permissions.test.mjs
          tests/ipc-channel-contracts.test.mjs tests/ipc-contract-drift.test.mjs
          tests/turn-engine.test.mjs tests/owned-process.test.mjs
          tests/canonical-temp.test.mjs
          tests/research-chat.test.mjs tests/research-evidence.test.mjs
          tests/research-session-state.test.mjs
          tests/architecture-followup.test.mjs
          tests/chem-source-packaging.test.mjs
          tests/architecture-storage.test.mjs tests/harness-journal-authority.test.mjs
          tests/harness-source-recovery.test.mjs tests/research-workflow-runtime.test.mjs
      - name: Run managed Study contracts and source-runtime CPU references
        run: >-
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=tap --test-reporter-destination=../../build/ci/workbench-managed-study.tap
          tests/research-project-store.test.mjs tests/research-plan.test.mjs
          tests/managed-research.test.mjs tests/managed-research-boundaries.test.mjs
          tests/managed-research-evidence.test.mjs tests/managed-research-cpu.test.mjs
          tests/managed-protein-cpu.test.mjs
      - name: Verify offline baseline
        run: node scripts/verify-offline.mjs
      - name: Build and verify required Proto sidecars from source
        run: pnpm build:sidecars
      - name: Build desktop bundles
        run: pnpm build:desktop
      - name: Preserve Workbench validation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-validation-evidence
          path: |
            build/ci/workbench-*
            build/next-architecture-20260924/managed-cpu-*/acceptance.json
            build/next-architecture-20260924/managed-protein-cpu-*/acceptance.json
          if-no-files-found: warn
