name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} baseline
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Test
        run: python -B -m unittest discover -s tests -p "test_*.py" -q

  workbench:
    name: Workbench offline baseline
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/proto-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/proto-workbench/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify offline baseline
        run: node scripts/verify-offline.mjs
      - name: Build desktop bundles
        run: pnpm build:desktop
